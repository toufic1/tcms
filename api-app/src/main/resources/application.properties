spring.application.name=tcms

server.port=8080

# ---------- Database (PostgreSQL) ----------
# ${NAME:default} means: use environment variable NAME if it is set, otherwise the default.
# Locally the defaults are used. On the VPS, Jenkins/Docker will set DB_URL, DB_USERNAME, DB_PASSWORD,
# so the real production password never appears in this file or on GitHub.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tcms}
spring.datasource.username=${DB_USERNAME:tcms}
spring.datasource.password=${DB_PASSWORD:tcms}

# ---------- JPA / Hibernate ----------
# update = Hibernate creates/alters tables to match the entities on startup.
# Fine while learning; later we replace it with Flyway migrations (versioned SQL files).
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs, so you can learn what it does
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Don't keep a DB connection open while the JSON response is written (avoids hidden queries)
spring.jpa.open-in-view=false

# ---------- Actuator (health check) ----------
# Only expose the health endpoint over HTTP (other endpoints like /env can leak secrets).
management.endpoints.web.exposure.include=health
# Show which parts are UP/DOWN (e.g. "db"), but not details like the database URL.
management.endpoint.health.show-components=always

logging.level.org.springframework.web=DEBUG

# ---------- Redis (cache) ----------
# Locally: localhost. In Docker Compose: the service name "redis".
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
# If Redis does not answer in 2s, fail fast (the default waits 1 minute)
spring.data.redis.timeout=2s
# Store the @Cacheable results in Redis
spring.cache.type=redis

