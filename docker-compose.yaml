services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcms
      POSTGRES_USER: tcms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcms -d tcms"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: tcms-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tcms
      DB_USERNAME: tcms
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    ports:
      - "8080:8080"

volumes:
  pgdata:
